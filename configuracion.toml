# Reglas para limpiar cada documento. La explicación de cada uno está en
# documentos/<documento>/README.md.
#
# Cada banco tiene su sección en [bancos.<Banco>]: las reglas de su extracto y
# la carpeta donde se guardan sus resultados (output/<mes>/<carpeta>/).
# El libro del ERP tiene una sola sección, [erp], igual para todas las cuentas;
# su resultado va a la carpeta del banco con el que se lo convierte.
#
# Qué dice cada regla:
#   documento      nombre del resultado: "<documento> - <original>.xlsx" (lo lee la etapa 2)
#   encabezados    la fila de encabezados de la tabla; si el archivo no la tiene, no se convierte
#   fecha, codigo, descripcion, credito, debito   qué columna va a cada columna de la salida
#   formato_fecha  cómo viene escrita la fecha si viene como texto; si falta, viene como fecha de Excel
#   seguidas       (opcional) columnas que tienen que estar juntas y en ese orden
#   ignorar        (opcional) filas que no son movimientos: {columna = "texto"}

[bancos.BBVA]
carpeta = "BBVA"
documento = "banco_bbva"
# Arriba de la tabla hay filas de título; se ignoran.
encabezados = ["Fecha", "Fecha Valor", "Concepto", "Codigo", "Número Documento",
               "Oficina", "Crédito", "Débito", "Detalle"]
fecha = "Fecha"
formato_fecha = "%d-%m-%Y"  # viene como texto: 30-09-2026
codigo = "Codigo"           # el código del tipo de movimiento, ej. 236; viene como texto, con sus ceros
descripcion = "Detalle"
credito = "Crédito"
debito = "Débito"           # viene en negativo; el motor lo toma sin signo

[bancos.Galicia]
carpeta = "Galicia"
documento = "banco_galicia"
encabezados = ["Fecha", "Descripción", "Origen", "Débitos", "Créditos", "Grupo de Conceptos",
               "Concepto", "Número de Terminal", "Observaciones Cliente", "Número de Comprobante",
               "Leyendas Adicionales 1", "Leyendas Adicionales 2", "Leyendas Adicionales 3",
               "Leyendas Adicionales 4", "Tipo de Movimiento", "Saldo"]
fecha = "Fecha"             # viene como fecha real de Excel
codigo = "Grupo de Conceptos"  # el grupo del movimiento, ej. 000901 - Impuestos
descripcion = "Descripción"
credito = "Créditos"
debito = "Débitos"          # viene en positivo; el motor lo pone negativo

[bancos.Supervielle]
carpeta = "Supervielle"
documento = "banco_supervielle"
encabezados = ["Fecha", "Hora", "Concepto", "Detalle", "Débito", "Crédito", "Saldo"]
fecha = "Fecha"
formato_fecha = "%d/%m/%Y"  # viene como texto: 30/09/2026
codigo = "Concepto"         # el tipo de movimiento, ej. Impuesto Débitos y Créditos/DB
descripcion = "Detalle"
credito = "Crédito"
debito = "Débito"           # viene en positivo; el motor lo pone negativo

[erp]
documento = "sistema_finnegans"
encabezados = ["Año - mes", "Codigo cuenta", "Cuenta", "Fecha", "Comprobante",
               "Descripción", "Debe", "Haber", "Documento", "Tipo de documento"]
fecha = "Fecha"             # viene como fecha real de Excel
codigo = "Tipo de documento"  # ej. Orden de pago, Recibo de Cobranzas
descripcion = "Descripción"
credito = "Debe"            # plata que entra al banco
debito = "Haber"            # plata que sale del banco
# "Debe" y "Haber" aparecen dos veces: un par en pesos y otro en dólares.
# El de pesos es el que está entre Descripción y Documento. Si esas cuatro
# columnas no vienen juntas y en este orden, el programa frena.
seguidas = ["Descripción", "Debe", "Haber", "Documento"]
# El "Saldo Inicial" no es un movimiento. Si trajera monto, el programa frena.
ignorar = { Documento = "Saldo Inicial" }
